<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emi Central Switch Demo</title>
    <!-- Tailwind CSS for rapid premium styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        vnpt: { blue: '#0066CC', light: '#E8F2FB', gradient1: '#2E85FF', gradient2: '#0052A3' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .mobile-frame {
            width: 375px;
            height: 812px;
            background: linear-gradient(135deg, #f0f7ff 0%, #e0eaf5 100%);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            border: 8px solid #ffffff;
        }

        /* Smooth transitions */
        .transition-all-smooth {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dropdown animation */
        #emi-dropdown {
            transform-origin: top center;
            transform: scaleY(0);
            opacity: 0;
            transition: transform 0.2s ease-out, opacity 0.2s ease-out;
        }

        #emi-dropdown.open {
            transform: scaleY(1);
            opacity: 1;
            pointer-events: auto;
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>

    <div class="mobile-frame font-sans flex flex-col">
        <!-- Status Bar space -->
        <div class="h-12 w-full"></div>

        <!-- Emi Area (Header) -->
        <div class="px-5 pt-2 relative z-50">
            <!-- Emi Avatar + Bubble -->
            <div class="flex items-end space-x-3 relative">
                <!-- Simulated Emi Avatar -->
                <div
                    class="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-400 to-purple-400 shadow-lg flex-shrink-0 flex justify-center items-center overflow-hidden border-2 border-white">
                    <span class="text-3xl">👩‍💼</span>
                </div>

                <!-- Chat Bubble -->
                <div class="glass-card p-4 rounded-2xl rounded-bl-sm shadow-sm relative w-full mb-2">
                    <!-- Sparkle icon -->
                    <div class="absolute -top-3 -left-2 text-2xl animate-pulse">✨</div>

                    <p class="text-sm text-gray-700 leading-relaxed font-medium" id="emi-text">
                        Này bạn ơi! Emi đang coi sóc dịch vụ cho
                        <!-- The Context Pill -->
                        <button id="switch-btn"
                            class="inline-flex items-center gap-1 bg-vnpt-gradient1 text-white px-2 py-0.5 mt-1 rounded-full font-semibold shadow-md active:scale-95 transition-all-smooth relative">
                            <span id="current-number">📱 0888 698 106</span>
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                    d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        của bạn đây!
                    </p>

                    <!-- Dropdown List (Absolute to bubble) -->
                    <div id="emi-dropdown"
                        class="absolute top-full left-0 mt-3 w-72 bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden z-50 pointer-events-none">
                        <div class="p-3">
                            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-2 mb-2">Di động
                            </div>

                            <!-- Item 1 (Active) -->
                            <button onclick="selectNumber('📱 0888 698 106', false)"
                                class="w-full text-left flex justify-between items-center px-3 py-3 rounded-2xl bg-vnpt-light text-vnpt-blue transition-all-smooth">
                                <span class="font-bold">0888 698 106</span>
                                <span class="text-xs font-medium px-2 py-1 bg-blue-100 rounded-lg">Của bạn</span>
                            </button>

                            <!-- Item 2 (Warning) -->
                            <button onclick="selectNumber('📱 0912 345 678', true)"
                                class="w-full text-left flex justify-between items-center px-3 py-3 rounded-2xl hover:bg-gray-50 mt-1 transition-all-smooth">
                                <div>
                                    <span class="font-bold text-gray-800 block">0912 345 678</span>
                                    <span class="text-xs text-gray-500">Số của Bố</span>
                                </div>
                                <span
                                    class="text-xs font-semibold px-2 py-1 bg-red-50 text-red-600 rounded-lg flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></span> Sắp hết Data
                                </span>
                            </button>

                            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-2 mt-4 mb-2">
                                Internet / MyTV</div>

                            <!-- Item 3 -->
                            <button onclick="selectNumber('🌐 Fiber 12345', false)"
                                class="w-full text-left flex justify-between items-center px-3 py-3 rounded-2xl hover:bg-gray-50 transition-all-smooth">
                                <div>
                                    <span class="font-bold text-gray-800 block">HDC12345</span>
                                    <span class="text-xs text-gray-500">Nhà ở quê</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab replacement (Dành cho bạn / Bản tin) -->
            <div class="flex space-x-6 px-16 mt-4">
                <div class="text-vnpt-blue font-bold text-base relative">
                    Dành cho bạn
                    <div class="absolute -bottom-2 left-0 right-0 h-1 bg-vnpt-gradient1 rounded-full opacity-80"></div>
                </div>
                <div class="text-gray-500 font-medium text-base">Bản tin <span
                        class="bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full ml-1">3</span></div>
            </div>
        </div>

        <!-- Content Area (Cleaned Card) -->
        <div class="px-5 mt-6 relative z-10 transition-all-smooth" id="dashboard-content">
            <!-- Main Card (No Phone Number Inside!) -->
            <div class="bg-white rounded-[32px] p-5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100">

                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-bold text-gray-800">Tình trạng thuê bao</h2>
                    <div
                        class="w-8 h-8 rounded-full bg-gray-50 flex justify-center items-center text-gray-400 hover:bg-gray-100 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z">
                            </path>
                        </svg>
                    </div>
                </div>

                <!-- Two Columns for Clean Data -->
                <div class="grid grid-cols-2 gap-4">
                    <!-- Col 1 -->
                    <div class="bg-gradient-to-br from-[#F5F8FF] to-[#EBF3FF] rounded-3xl p-4 border border-blue-50/50">
                        <p class="text-xs text-gray-500 mb-1">Tài khoản chính</p>
                        <p class="text-2xl font-bold text-gray-800 mb-2 truncate" id="main-balance">2.500đ</p>
                        <div class="flex items-center text-xs text-red-500 font-medium">
                            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                            </svg>
                            32.000đ
                        </div>
                    </div>

                    <!-- Col 2 -->
                    <div
                        class="bg-gradient-to-br from-[#F0FCF9] to-[#E3F9F5] rounded-3xl p-4 border border-teal-50/50 relative overflow-hidden">
                        <p class="text-xs text-gray-500 mb-1">Cước / Data</p>
                        <p class="text-2xl font-bold text-gray-800 mb-1 truncate" id="data-balance">410 <span
                                class="text-sm text-gray-400 font-normal">MB</span></p>

                        <!-- Decorative Circle to replace complex icon -->
                        <div
                            class="absolute -right-4 -bottom-4 w-16 h-16 border-4 border-teal-200 rounded-full opacity-50">
                        </div>
                        <div
                            class="absolute -right-2 -bottom-2 w-12 h-12 bg-teal-100 rounded-full flex items-center justify-center">
                            <svg class="w-5 h-5 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <div
                    class="mt-4 bg-vnpt-light rounded-[24px] p-2 flex justify-between items-center border border-blue-50">
                    <div class="flex items-center gap-3 pl-2">
                        <div
                            class="w-10 h-10 bg-white rounded-full shadow-sm flex justify-center items-center text-vnpt-blue">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">30.000đ</p>
                            <p class="text-xs text-green-500">Giá: 28.950đ</p>
                        </div>
                    </div>
                    <button
                        class="bg-gradient-to-r from-vnpt-gradient1 to-vnpt-gradient2 text-white px-5 py-3 rounded-full text-sm font-bold shadow-md hover:shadow-lg active:scale-95 transition-all-smooth">
                        Nạp ngay
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const switchBtn = document.getElementById('switch-btn');
        const dropdown = document.getElementById('emi-dropdown');
        const currentNumber = document.getElementById('current-number');
        const emiText = document.getElementById('emi-text');
        const content = document.getElementById('dashboard-content');

        let isWarningSelected = false;

        // Toggle Dropdown
        switchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdown.classList.contains('open');

            if (!isOpen) {
                dropdown.classList.add('open');
                emiText.innerHTML = `Anh muốn Emi kiểm tra số nào tiếp theo?`;
            } else {
                dropdown.classList.remove('open');
                resetText();
            }
        });

        // Close on outside click
        document.addEventListener('click', () => {
            if (dropdown.classList.contains('open')) {
                dropdown.classList.remove('open');
                resetText();
            }
        });

        dropdown.addEventListener('click', (e) => e.stopPropagation());

        function selectNumber(number, isWarning) {
            currentNumber.innerText = number;
            dropdown.classList.remove('open');
            isWarningSelected = isWarning;

            // Setup text based on selection
            resetText();

            // Skeleton loading effect for dash
            content.style.opacity = '0.3';
            content.style.transform = 'scale(0.98)';

            setTimeout(() => {
                content.style.opacity = '1';
                content.style.transform = 'scale(1)';

                // Mock data change
                if (isWarning) {
                    document.getElementById('main-balance').innerText = '100đ';
                    document.getElementById('main-balance').classList.add('text-red-500');
                    document.getElementById('data-balance').innerHTML = '0 <span class="text-sm text-gray-400 font-normal">MB</span>';
                } else {
                    document.getElementById('main-balance').innerText = '15.000đ';
                    document.getElementById('main-balance').classList.remove('text-red-500');
                    document.getElementById('data-balance').innerHTML = '1.200 <span class="text-sm text-gray-400 font-normal">MB</span>';
                }
            }, 500);
        }

        function resetText() {
            if (isWarningSelected) {
                emiText.innerHTML = `Đổi sang số ${switchBtn.outerHTML} thành công! Emi thấy số này <span class="font-bold text-red-500">sắp hết Data</span> rồi đó.`;
            } else {
                emiText.innerHTML = `Này bạn ơi! Emi đang coi sóc dịch vụ cho ${switchBtn.outerHTML} của bạn đây!`;
            }

            // Reattach event listener to new button inside innerHTML
            setTimeout(() => {
                document.getElementById('switch-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('open');
                    if (dropdown.classList.contains('open')) {
                        emiText.innerHTML = `Anh muốn Emi kiểm tra số nào tiếp theo?`;
                    }
                });
            }, 50);
        }
    </script>

</body>

</html>
