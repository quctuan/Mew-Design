<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
    --text: var(--figma-color-text, #1a1a1a);
    --text2: var(--figma-color-text-secondary, #7a7a7a);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #fff);
    --success: var(--figma-color-bg-success, #14ae5c);
    --warning: var(--figma-color-bg-warning, #ffcd29);
    --danger: var(--figma-color-bg-danger, #f24822);
    --hover: var(--figma-color-bg-hover, rgba(0, 0, 0, 0.05));
  }

  body {
    margin: 0;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .ctx {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }

  .ctx .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--bg2);
    color: var(--text2);
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .ctx .tag.sel {
    background: color-mix(in srgb, var(--brand) 16%, transparent);
    color: var(--brand);
  }

  .ctx .name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text2);
    font-size: 12px;
  }

  button.primary {
    margin-left: auto;
    border: 0;
    background: var(--brand);
    color: var(--on-brand);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }

  button.primary:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* Stats */
  #stats {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .overall {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }

  .overall .pct {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
  }

  .overall .lbl {
    color: var(--text2);
  }

  .overall .nodes {
    margin-left: auto;
    color: var(--text2);
    font-size: 13px;
  }

  .bar {
    height: 6px;
    border-radius: 3px;
    background: var(--bg3);
    overflow: hidden;
    margin-bottom: 10px;
  }

  .bar>span {
    display: block;
    height: 100%;
    background: var(--success);
    transition: width .3s;
  }

  .cats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .cat {
    background: var(--bg2);
    border-radius: 6px;
    padding: 6px 8px;
  }

  .cat .k {
    color: var(--text2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .3px;
  }

  .cat .v {
    font-size: 17px;
    font-weight: 600;
    margin-top: 2px;
  }

  .cat .n {
    color: var(--text2);
    font-size: 11px;
  }

  /* Controls */
  #controls {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .tabs button {
    border: 0;
    background: color-mix(in srgb, #0d99ff 12%, transparent);
    /* blue scale-100 */
    color: #0d99ff;
    height: 32px;
    padding: 0 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
  }

  .tabs button.active {
    background: #0d99ff;
    color: #fff;
  }

  .filt-row {
    display: flex;
    gap: 6px;
  }

  #search {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 14px;
    outline: none;
  }

  #search:focus {
    border-color: var(--brand);
  }

  #statusFilter {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    padding: 0 6px;
    font-size: 14px;
    outline: none;
  }

  /* List */
  #list {
    flex: 1;
    overflow-y: auto;
  }

  /* Result table header */
  .thead {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .3px;
  }

  .thead .h-val {
    width: 148px;
    flex-shrink: 0;
    padding: 7px 12px;
  }

  .thead .h-rest {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr 54px 56px;
    gap: 6px;
    padding: 7px 12px 7px 0;
  }

  .thead .h-usage {
    text-align: right;
  }

  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
    background-size: 8px 8px;
    background-position: 0 0, 0 4px, 4px -4px, -4px 0;
    position: relative;
    overflow: hidden;
  }

  .swatch>i {
    position: absolute;
    inset: 0;
    display: block;
  }

  .chip {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    flex-shrink: 0;
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 11px;
  }

  /* Value group = value cell (col 1) + one row per binding (cols 2-4) */
  .vgroup {
    display: flex;
    border-bottom: 1px solid var(--border);
  }

  .vgroup .vval {
    width: 148px;
    flex-shrink: 0;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vval .vtext {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .vval .vhex {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .vval .vop {
    color: var(--text2);
    font-size: 11px;
    flex-shrink: 0;
  }

  .vsubs {
    flex: 1;
    min-width: 0;
  }

  .vsub {
    border-top: 1px solid var(--border);
  }

  .vsub:first-child {
    border-top: 0;
  }

  .vsub-main {
    display: grid;
    grid-template-columns: 1fr 54px 56px;
    gap: 6px;
    align-items: center;
    padding: 18px 12px 18px 0; /* 24px content + 2x18px = 60px, 1.5x the old 40px row */
  }

  .vsub-main:hover {
    background: var(--hover);
  }

  .col-token {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .tokentag {
    display: inline-block;
    max-width: 100%;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 5px;
    color: #fff;
  }

  .tokentag.style {
    background: var(--brand);
  }

  /* style  -> blue */
  .tokentag.token {
    background: #9747ff;
  }

  /* variable/token -> purple */
  .nolink {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    background: var(--danger);
    color: #fff;
    white-space: nowrap;
  }

  .col-usage {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 2px;
  }

  .col-usage .num {
    font-weight: 600;
  }

  .col-usage .num.red {
    color: var(--danger);
  }

  .col-act {
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  /* Placeholder for the merge slot so the go-to icon stays in one column across rows */
  .col-act .actspacer {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }

  .iconbtn {
    border: 0;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    width: 24px;
    height: 24px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .iconbtn:hover {
    background: var(--bg3);
    color: var(--text);
  }

  .iconbtn.chev svg {
    transition: transform .15s;
  }

  .iconbtn.chev.open svg {
    transform: rotate(90deg);
  }

  .occs {
    padding: 2px 12px 6px 0;
  }

  /* Same grid as .vsub-main so the count column lines up with the usage total above */
  .occ {
    display: grid;
    grid-template-columns: 1fr 54px 56px;
    gap: 6px;
    align-items: center;
    padding: 12px 0; /* 24px content + 2x12px = 48px, 1.5x the old 32px row */
    border-top: 1px dashed var(--border);
  }

  .occ .on {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .occ .op {
    color: var(--text2);
    font-size: 12px;
    white-space: nowrap;
    text-align: right;
    padding-right: 26px; /* chevron (24px) + gap (2px) offset of the usage number above */
  }

  .occ .iconbtn {
    justify-self: end;
    margin-right: 24px; /* sit under the go-to slot, leaving the merge slot free */
  }

  /* Empty & progress */
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--text2);
    line-height: 1.6;
  }

  /* Pre-scan call-to-action: centered in the page, Scan button below the message */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    color: var(--text2);
    line-height: 1.6;
  }

  .empty-state .empty-img {
    width: 140px;
    height: 140px;
    object-fit: contain;
  }

  .empty-state .empty-msg {
    white-space: nowrap;
  }

  .empty-state button.primary {
    margin-left: 0;
  }

  #progress {
    padding: 20px;
    text-align: center;
    color: var(--text2);
  }

  #progress .bar {
    margin-top: 10px;
  }

  /* Toast */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    max-width: 90%;
    text-align: center;
  }

  [hidden] {
    display: none !important;
  }
</style>

<div id="app">
  <header id="appHeader" hidden>
    <div class="ctx">
      <span class="tag" id="ctxTag" hidden>
        <svg width="11" height="11" viewBox="0 0 12 12">
          <rect x="1.5" y="1.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" />
        </svg>
        <span id="ctxTagText">Full Page</span>
      </span>
    </div>
    <button id="scanBtn" class="primary">Re-scan</button>

  <section id="stats" hidden></section>

  <section id="controls" hidden>
    <div class="tabs" id="tabs">
      <button data-cat="all" class="active">All</button>
      <button data-cat="color">Color</button>

      <button data-cat="spacing">Spacing</button>

      <select id="statusFilter">

        <option value="raw">Unlinked</option>
        <option value="partial">Partially linked</option>
        <option value="tokenized">Linked</option>

  </section>

    <div class="empty-msg" id="emptyMsg">Press <b>Scan</b> to scan all Styles & Variables</div>
    <button id="scanBtnCenter" class="primary">Scan</button>
  </div>
  <div id="progress" hidden></div>
</div>

<div id="toast" hidden></div>

<script>
  const $ = (s) => document.querySelector(s);
  const listEl = $('#list'), statsEl = $('#stats'), controlsEl = $('#controls');
  const emptyEl = $('#empty'), progressEl = $('#progress'), scanBtn = $('#scanBtn');
  const appHeader = $('#appHeader'), emptyMsg = $('#emptyMsg'), scanBtnCenter = $('#scanBtnCenter');

  const state = {
    groups: [], byKey: {}, stats: null, nodeCount: 0,
    filterCat: 'all', filterStatus: 'all', search: '',
    expanded: new Set(),
  };

  function updateContext(scope, name) {
    const tag = $('#ctxTag');
    tag.hidden = false;
    $('#ctxTagText').textContent = scope === 'selection' ? (name || 'Selection') : 'Full Page';
    tag.classList.toggle('sel', scope === 'selection');
  }

  const CAT_LABEL = { color: 'Color', radius: 'Radius', spacing: 'Spacing', textSize: 'Text' };

  function post(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  let toastTimer;
  function toast(text) {
    const t = $('#toast'); t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
  }

  // ---- Scan ----
  function doScan() {
    scanBtn.disabled = true; scanBtnCenter.disabled = true;
    emptyEl.hidden = true;
    progressEl.hidden = false; progressEl.innerHTML = 'Scanning…';
    post({ type: 'scan' });
  }
  scanBtn.onclick = doScan;
  scanBtnCenter.onclick = doScan;

  // Show the centered empty state; withBtn controls the "Scan" button under the message.
  function showEmpty(html, withBtn) {
    emptyMsg.innerHTML = html;
    scanBtnCenter.hidden = !withBtn;
    emptyEl.hidden = false;
    listEl.hidden = true;
  }

  // ---- Filters ----
  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-cat]'); if (!b) return;
    state.filterCat = b.dataset.cat;
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('active', x === b));
    render();
  });
  $('#search').addEventListener('input', (e) => { state.search = e.target.value.trim().toLowerCase(); render(); });
  $('#statusFilter').addEventListener('change', (e) => { state.filterStatus = e.target.value; render(); });

  // ---- Icons ----
  const ICON = {
    select: '<svg width="20" height="20" viewBox="0 0 14 14"><path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="7" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    merge: '<svg width="20" height="20" viewBox="0 0 14 14"><path d="M3 2v3a4 4 0 0 0 4 4h4M11 9l-2-2M11 9l-2 2" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M4.5 3l3 3-3 3" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // Split a value group's occurrences into rows by binding: one row per token/style, plus a
  // "No Link" row for the raw ones. Bound rows first (by count), No Link last.
  const NONE = '__none__';
  function bindKey(o) { return o.binding.type === 'none' ? NONE : o.binding.tokenId; }

  function buildSubs(g) {
    const map = new Map();
    for (const o of g.occurrences) {
      const k = bindKey(o);
      let s = map.get(k);
      if (!s) { s = { key: k, type: o.binding.type, name: o.binding.tokenName, remote: !!o.binding.remote, occ: [] }; map.set(k, s); }
      s.occ.push(o);
    }
    return Array.from(map.values()).sort((a, b) => (a.type === 'none') - (b.type === 'none') || b.occ.length - a.occ.length);
  }

  function subOccurrences(g, subKey) {
    return g.occurrences.filter((o) => bindKey(o) === subKey);
  }

  function valueCell(g) {
    if (g.category === 'color') {
      const hex = g.swatch || '';
      const hex6 = hex.slice(1, 7);
      const a = hex.length >= 9 ? parseInt(hex.slice(7, 9), 16) : 255;
      const op = Math.round((a / 255) * 100);
      return '<span class="swatch"><i style="background:' + esc(hex) + '"></i></span>'
        + '<div class="vtext"><div class="vhex">' + esc(hex6) + '</div><div class="vop">' + op + '%</div></div>';
    }
    return '<span class="chip">' + esc(g.numberValue != null ? g.numberValue : '#') + '</span>'
      + '<div class="vtext"><div class="vhex">' + esc(g.displayValue) + '</div></div>';
  }

  function tokenCell(s) {
    if (s.type === 'none') return '<span class="nolink">No Link</span>';
    const cls = s.type === 'style' ? 'style' : 'token'; // style -> blue, variable -> purple
    return '<span class="tokentag ' + cls + '" title="' + esc(s.name || '') + '">' + esc(s.name || '') + '</span>';
  }

  // Count distinct layers (not raw occurrences) so a layer using the value in both fill and
  // stroke counts once, and the number matches what "go to element" selects.
  function layerCount(occ) {
    return new Set(occ.map((o) => o.nodeId)).size;
  }

  // Expanded panel under Usage. Categories with buckets tally per property (color: Fill/Stroke,
  // spacing: Gap + 4 paddings) instead of listing each layer/frame; the rest keep the per-layer list.
  function spacingField(o) { return (o.fields && o.fields[0]) || ''; }
  const OCC_BUCKETS = {
    color: [
      { key: 'fills', label: 'Fill', match: (o) => (o.paintProp || 'fills') === 'fills' },
      { key: 'strokes', label: 'Stroke', match: (o) => o.paintProp === 'strokes' },
    ],
    spacing: [ // counterAxisSpacing (gap wrap) counts as Gap
      { key: 'gap', label: 'Gap', match: (o) => spacingField(o) === 'itemSpacing' || spacingField(o) === 'counterAxisSpacing' },
      { key: 'pt', label: 'Top Padding', match: (o) => spacingField(o) === 'paddingTop' },
      { key: 'pb', label: 'Bottom Padding', match: (o) => spacingField(o) === 'paddingBottom' },
      { key: 'pl', label: 'Left Padding', match: (o) => spacingField(o) === 'paddingLeft' },
      { key: 'pr', label: 'Right Padding', match: (o) => spacingField(o) === 'paddingRight' },
    ],
    radius: [ // uniform + per-corner all tally as one Corner radius row
      { key: 'corner', label: 'Corner radius', match: () => true },
    ],
    textSize: [ // uniform + per-range all tally as one Font size row
      { key: 'fontsize', label: 'Font size', match: () => true },
    ],
  };

  function occRows(g, s) {
    const buckets = OCC_BUCKETS[g.category];
    if (buckets) {
      return buckets.map((b) => {
        const list = s.occ.filter(b.match);
        if (!list.length) return '';
        return '<div class="occ"><span class="on">' + b.label + '</span>'
          + '<span class="op">' + list.length + '</span>'
          + '<button class="iconbtn" data-action="goto-bucket" data-key="' + esc(g.key) + '" data-sub="' + esc(s.key) + '" data-bucket="' + b.key + '" title="Go to element">' + ICON.select + '</button></div>';
      }).join('');
    }
    return s.occ.map((o) =>
      '<div class="occ"><span class="on">' + esc(o.nodeName) + '</span>'
      + '<span class="op">' + esc(o.property) + '</span>'
      + '<button class="iconbtn" data-action="goto-node" data-nid="' + esc(o.nodeId) + '" title="Go to element">' + ICON.select + '</button></div>'
    ).join('');
  }

  function filtered() {
    return state.groups.filter((g) => {
      if (state.filterCat !== 'all' && g.category !== state.filterCat) return false;
      if (state.filterStatus !== 'all' && g.status !== state.filterStatus) return false;
      if (state.search) {
        const names = g.occurrences.map((o) => o.binding.tokenName || '').join(' ');
        const hay = (g.displayValue + ' ' + names).toLowerCase();
        if (hay.indexOf(state.search) === -1) return false;
      }
      return true;
    });
  }

  const THEAD = '<div class="thead"><div class="h-val">Value</div>'
    + '<div class="h-rest"><div>Style / Token</div><div class="h-usage">Usage</div><div></div></div></div>';

  function render() {
    const groups = filtered();
    if (!state.groups.length) { listEl.innerHTML = ''; return; }
    if (!groups.length) { listEl.innerHTML = '<div class="empty">No results match the filter.</div>'; return; }

    listEl.innerHTML = THEAD + groups.map((g) => {
      const subs = buildSubs(g);
      const showMerge = subs.length > 1; // only when a value mixes No Link / style / token
      const subsHtml = subs.map((s) => {
        const open = state.expanded.has(g.key + '::' + s.key);
        const skAttr = 'data-key="' + esc(g.key) + '" data-sub="' + esc(s.key) + '"';
        const mergeTitle = s.type === 'none' ? 'Unlink everything with this value' : ('Merge entire value to ' + (s.name || ''));
        const occs = open ? '<div class="occs">' + occRows(g, s) + '</div>' : '';
        return '<div class="vsub"><div class="vsub-main">'
          + '<div class="col-token">' + tokenCell(s) + '</div>'
          + '<div class="col-usage"><span class="num' + (s.type === 'none' ? ' red' : '') + '">' + layerCount(s.occ) + '</span>'
          + '<button class="iconbtn chev ' + (open ? 'open' : '') + '" data-action="toggle-sub" ' + skAttr + ' title="Element list">' + ICON.chev + '</button></div>'
          + '<div class="col-act">'
          + '<button class="iconbtn" data-action="goto-sub" ' + skAttr + ' title="Go to element">' + ICON.select + '</button>'
          + (showMerge ? '<button class="iconbtn" data-action="merge-sub" ' + skAttr + ' title="' + esc(mergeTitle) + '">' + ICON.merge + '</button>' : '<span class="actspacer"></span>')
          + '</div></div>' + occs + '</div>';
      }).join('');
      return '<div class="vgroup" data-key="' + esc(g.key) + '"><div class="vval">' + valueCell(g) + '</div><div class="vsubs">' + subsHtml + '</div></div>';
    }).join('');
  }

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]'); if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'goto-node') { post({ type: 'zoom-node', nodeId: btn.dataset.nid }); return; }
    const g = state.byKey[btn.dataset.key]; if (!g) return;
    if (action === 'toggle-sub') {
      const k = g.key + '::' + btn.dataset.sub;
      if (state.expanded.has(k)) state.expanded.delete(k); else state.expanded.add(k);
      render();
    } else if (action === 'goto-sub') {
      post({ type: 'select-nodes', nodeIds: uniqueIds(subOccurrences(g, btn.dataset.sub)) });
    } else if (action === 'goto-bucket') {
      const b = (OCC_BUCKETS[g.category] || []).find((x) => x.key === btn.dataset.bucket);
      if (b) post({ type: 'select-nodes', nodeIds: uniqueIds(subOccurrences(g, btn.dataset.sub).filter(b.match)) });
    } else if (action === 'merge-sub') {
      mergeConsolidate(g, btn.dataset.sub);
    }
  });

  function uniqueIds(occs) {
    const seen = new Set(), out = [];
    for (const o of occs) if (!seen.has(o.nodeId)) { seen.add(o.nodeId); out.push(o.nodeId); }
    return out;
  }

  // ---- Merge: consolidate the whole value to a row's binding ----
  // Click merge on a row => bring every OTHER occurrence of the value to that row's binding.
  // No Link row => unlink all; style/token row => apply that style/token to all.
  function mergeConsolidate(g, subKey) {
    const rows = subOccurrences(g, subKey);
    if (!rows.length) return;
    const b = rows[0].binding;
    const target = b.type === 'none'
      ? { kind: 'none', category: g.category }
      : { kind: b.type, id: b.tokenId, name: b.tokenName, category: g.category };
    const others = g.occurrences.filter((o) => bindKey(o) !== subKey);
    if (!others.length) return;
    toast(b.type === 'none' ? 'Unlinking all…' : ('Merging to "' + (b.tokenName || '') + '"…'));
    post({ type: 'apply-token', occurrences: others, target });
  }

  // ---- Messages from main ----
  onmessage = (e) => {
    const msg = e.data.pluginMessage; if (!msg) return;
    if (msg.type === 'scan-progress') {
      progressEl.hidden = false;
      progressEl.innerHTML = 'Scanning ' + msg.done + ' / ' + msg.total + ' nodes…'
        + '<div class="bar"><span style="width:' + Math.round((msg.done / Math.max(1, msg.total)) * 100) + '%;background:var(--brand)"></span></div>';
    } else if (msg.type === 'scan-result') {
      appHeader.hidden = false;
      scanBtn.disabled = false; scanBtnCenter.disabled = false; scanBtn.textContent = 'Re-scan'; progressEl.hidden = true;
      updateContext(msg.scope, msg.contextName);
      state.groups = msg.groups; state.stats = msg.stats; state.nodeCount = msg.nodeCount;
      state.byKey = {}; msg.groups.forEach((g) => (state.byKey[g.key] = g));
      Array.from(state.expanded).forEach((k) => { if (!state.byKey[k.split('::')[0]]) state.expanded.delete(k); });
      renderStats();
      statsEl.hidden = false; controlsEl.hidden = false;
      if (!state.groups.length) { showEmpty('No values found in this scope.', false); }
      else { emptyEl.hidden = true; listEl.hidden = false; }
      render();
    } else if (msg.type === 'apply-done') {
      const fail = msg.failed && msg.failed.length;
      toast('Applied to ' + msg.applied + ' element(s)' + (fail ? ' · ' + fail + ' failed' : '') + '. Updating…');
    } else if (msg.type === 'error') {
      scanBtn.disabled = false; scanBtnCenter.disabled = false; progressEl.hidden = true;
      toast(msg.message);
      if (!state.groups.length) { showEmpty(esc(msg.message), true); }
    }
  };

  function renderStats() {
    const s = state.stats; if (!s) return;
    const cat = (k) => {
      const c = s.byCategory[k];
      return '<div class="cat"><div class="k">' + CAT_LABEL[k] + '</div><div class="v">' + c.pct + '%</div><div class="n">' + c.tokenized + '/' + c.total + '</div></div>';
    };
    statsEl.innerHTML =
      '<div class="overall"><span class="pct">' + s.overall.pct + '%</span><span class="lbl">tokenized</span>'
      + '<span class="nodes">' + s.overall.tokenized + '/' + s.overall.total + ' values · ' + state.nodeCount + ' nodes</span></div>'
      + '<div class="bar"><span style="width:' + s.overall.pct + '%"></span></div>'
      + '<div class="cats">' + ['color', 'radius', 'spacing', 'textSize'].map(cat).join('') + '</div>';
  }
</script>
