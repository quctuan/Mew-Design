<!doctype html>
<html lang="en" data-device="ios">
<!-- Design-system mode: add data-mode="ds" above and uncomment tokens.css below. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore: feature name</title>
  <link rel="stylesheet" href="frame.css">
  <!-- <link rel="stylesheet" href="tokens.css"> -->
  <style>
    /* Direction tokens: name them after their role, not their value. */
    :root {
      --ground: #F4F1EA;
      --ink: #17150F;
      --ink-2: #5A564C;
      --accent: #2F4BD8;   /* one accent, one job: write the job here */
    }
    .screen { --bg: var(--ground); --fg: var(--ink); }
    .screen[data-theme="dark"] { --bg: #14130F; --fg: #F4F1EA; }

    .content { flex: 1; display: flex; flex-direction: column; padding: 0 20px; }
    .eyebrow { margin: 16px 0 0; font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--ink-2); }
    .hero { margin: 8px 0 0; font-size: 44px; font-weight: 800; line-height: 1.02; letter-spacing: -0.03em; }
    .actions { margin-top: auto; padding-bottom: 12px; }
    .primary {
      width: 100%; min-height: 52px; border: 0; border-radius: 26px;
      background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 600;
    }
    .screen[data-theme="dark"] .eyebrow { color: #B9B4A8; }
  </style>
</head>
<body>
  <!-- One <section class="screen"> per frame. Real content only. -->
  <section class="screen" data-name="01-core" data-time="9:41">
    <div class="content">
      <p class="eyebrow">Today · 3 left</p>
      <h1 class="hero" data-layer="Hero title">The one thing this screen is about</h1>
      <div class="actions"><button class="primary" data-layer="Primary button">Do the core action</button></div>
    </div>
  </section>

  <section class="screen" data-name="02-core-dark" data-theme="dark" data-time="21:14">
    <div class="content">
      <p class="eyebrow">Tonight · 1 left</p>
      <h1 class="hero">The same screen, designed for dark</h1>
      <div class="actions"><button class="primary">Do the core action</button></div>
    </div>
  </section>

  <script src="frame.js"></script>
</body>
</html>
