<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <!-- Definitions -->
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4788FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFBE40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF7B00;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="800" height="240" fill="#F8FAFC" rx="16"/>

  <!-- Connecting Lines -->
  <path d="M 220 120 L 400 120 L 580 120" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="8 8" fill="none"/>
  
  <!-- Arrow heads -->
  <polygon points="330,110 350,120 330,130" fill="#94A3B8"/>
  <polygon points="560,110 580,120 560,130" fill="#94A3B8"/>

  <!-- Role 1: PM / Analyst -->
  <g transform="translate(100, 50)" filter="url(#shadow)">
    <rect width="130" height="140" rx="20" fill="white"/>
    <circle cx="65" cy="55" r="28" fill="url(#gradBlue)" opacity="0.1"/>
    
    <!-- User/Manager Icon -->
    <circle cx="65" cy="46" r="10" fill="url(#gradBlue)"/>
    <path d="M47 70 Q65 54 83 70 L83 74 L47 74 Z" fill="url(#gradBlue)"/>
    
    <text x="65" y="105" font-family="'Inter', sans-serif" font-size="15" font-weight="bold" fill="#1E293B" text-anchor="middle">Quản Lý (PM)</text>
    <text x="65" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Research &amp; Plan</text>
  </g>

  <!-- Role 2: UX Designer -->
  <g transform="translate(340, 50)" filter="url(#shadow)">
    <rect width="130" height="140" rx="20" fill="white"/>
    <circle cx="65" cy="55" r="28" fill="url(#gradOrange)" opacity="0.15"/>
    
    <!-- Pen Tool / Design Icon -->
    <path d="M50 63 L46 59 L62 43 L66 47 Z" fill="url(#gradOrange)"/>
    <path d="M46 59 L44 67 L50 63 Z" fill="url(#gradOrange)"/>
    <circle cx="68" cy="41" r="3" fill="url(#gradOrange)"/>
    
    <text x="65" y="105" font-family="'Inter', sans-serif" font-size="15" font-weight="bold" fill="#1E293B" text-anchor="middle">Thiết Kế (UX)</text>
    <text x="65" y="122" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Draw Flows &amp; UI</text>
  </g>

  <!-- Role 3: Quality Reviewer -->
  <g transform="translate(580, 50)" filter="url(#shadow)">
    <rect width="130" height="140" rx="20" fill="url(#gradBlue)"/>
    <!-- Checkmark icon -->
    <circle cx="65" cy="55" r="28" fill="white" opacity="0.2"/>
    <path d="M55 56 L62 63 L75 47" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="65" y="105" font-family="'Inter', sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Reviewer (QR)</text>
    <text x="65" y="122" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Audit &amp; Approve</text>
  </g>
  
  <!-- Triggers/Labels -->
  <rect x="235" y="80" width="100" height="26" rx="13" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="285" y="97" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#2563EB" text-anchor="middle">Tự đổi vai trò</text>

  <rect x="475" y="80" width="100" height="26" rx="13" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="525" y="97" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#EA580C" text-anchor="middle">Chấm điểm chéo</text>

</svg>
